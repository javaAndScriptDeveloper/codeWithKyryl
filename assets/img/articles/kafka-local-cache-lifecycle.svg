<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">How a Kafka-backed local cache starts and stays updated</title>
  <desc id="desc">During startup, a pod captures fixed Kafka end offsets, replays records into its local cache, and remains unready until every partition reaches its target. After readiness opens, requests read locally while the same listener continues applying later Kafka updates.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1D9E75"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#69827a"/>
    </marker>
    <style>
      .title { font: 700 28px Inter, Arial, sans-serif; fill: #1a1a1a; }
      .phase { font: 700 20px Inter, Arial, sans-serif; fill: #0F6E56; }
      .heading { font: 700 17px Inter, Arial, sans-serif; fill: #1a1a1a; }
      .label { font: 600 14px Inter, Arial, sans-serif; fill: #0F6E56; }
      .small { font: 500 14px Inter, Arial, sans-serif; fill: #52635d; }
      .tiny { font: 600 12px Inter, Arial, sans-serif; fill: #52635d; }
      .card { fill: #ffffff; stroke: #1D9E75; stroke-width: 2; }
      .soft { fill: #f0fdf8; stroke: #b9e8da; stroke-width: 1.5; }
      .phase-box { fill: #fbfefc; stroke: #b9e8da; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #1D9E75; stroke-width: 3; marker-end: url(#arrow); }
      .live { fill: none; stroke: #69827a; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect width="1200" height="760" rx="18" fill="#fbfefc"/>
  <text x="600" y="46" text-anchor="middle" class="title">From Kafka replay to a ready local cache</text>

  <!-- Phase 1 -->
  <rect x="34" y="72" width="1132" height="390" rx="16" class="phase-box"/>
  <rect x="58" y="92" width="306" height="38" rx="19" fill="#e6f7f2"/>
  <text x="211" y="118" text-anchor="middle" class="phase">1 · STARTUP REPLAY</text>
  <rect x="945" y="92" width="190" height="38" rx="19" fill="#fff0ed" stroke="#e7b5aa"/>
  <text x="1040" y="117" text-anchor="middle" style="font: 700 15px Inter, Arial, sans-serif; fill: #9d3b2e;">READINESS: DOWN</text>

  <!-- Kafka -->
  <rect x="65" y="176" width="210" height="212" rx="14" class="card"/>
  <text x="170" y="208" text-anchor="middle" class="heading">Compacted topic</text>
  <text x="170" y="233" text-anchor="middle" class="small">Retained latest state</text>
  <rect x="88" y="257" width="164" height="34" rx="7" class="soft"/>
  <text x="104" y="279" class="tiny">P0</text><text x="236" y="279" text-anchor="end" class="small">end: 42</text>
  <rect x="88" y="301" width="164" height="34" rx="7" class="soft"/>
  <text x="104" y="323" class="tiny">P1</text><text x="236" y="323" text-anchor="end" class="small">end: 67</text>
  <text x="170" y="365" text-anchor="middle" class="label">FIXED SNAPSHOT</text>

  <!-- Assignment -->
  <path d="M275 282H330" class="arrow"/>
  <rect x="337" y="183" width="230" height="198" rx="14" class="card"/>
  <circle cx="452" cy="228" r="25" fill="#1D9E75"/>
  <path d="M441 228h22M452 217v22" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="452" y="274" text-anchor="middle" class="heading">Assign partitions</text>
  <text x="452" y="301" text-anchor="middle" class="small">Capture current position</text>
  <text x="452" y="323" text-anchor="middle" class="small">and end offset once</text>
  <rect x="370" y="340" width="164" height="25" rx="12" fill="#e6f7f2"/>
  <text x="452" y="357" text-anchor="middle" class="label">TARGET DOES NOT MOVE</text>

  <!-- Listener -->
  <path d="M567 282H622" class="arrow"/>
  <text x="594" y="266" text-anchor="middle" class="tiny">REPLAY</text>
  <rect x="629" y="183" width="220" height="198" rx="14" class="card"/>
  <text x="739" y="224" text-anchor="middle" class="heading">Kafka listener</text>
  <text x="739" y="252" text-anchor="middle" class="small">Apply upsert or tombstone</text>
  <rect x="658" y="278" width="162" height="74" rx="10" class="soft"/>
  <text x="739" y="305" text-anchor="middle" class="label">SUCCESS FIRST</text>
  <text x="739" y="330" text-anchor="middle" class="small">then advance position</text>

  <!-- Cache + tracker -->
  <path d="M849 238H901" class="arrow"/>
  <rect x="908" y="164" width="216" height="106" rx="14" class="card"/>
  <text x="1016" y="202" text-anchor="middle" class="heading">Local cache</text>
  <text x="1016" y="229" text-anchor="middle" class="small">Concurrent in-memory map</text>
  <text x="1016" y="251" text-anchor="middle" class="label">PARTIAL DURING REPLAY</text>

  <path d="M849 331H901" class="arrow"/>
  <rect x="908" y="290" width="216" height="108" rx="14" class="card"/>
  <text x="1016" y="327" text-anchor="middle" class="heading">Readiness tracker</text>
  <text x="1016" y="354" text-anchor="middle" class="small">position ≥ fixed target</text>
  <text x="1016" y="378" text-anchor="middle" class="small">for every partition</text>

  <rect x="337" y="413" width="787" height="30" rx="8" fill="#0F6E56"/>
  <text x="730" y="434" text-anchor="middle" style="font: 700 14px Inter, Arial, sans-serif; fill: #fff;">No requests or scheduled work use the partial cache</text>

  <!-- Phase 2 -->
  <rect x="34" y="486" width="1132" height="228" rx="16" class="phase-box"/>
  <rect x="58" y="506" width="306" height="38" rx="19" fill="#e6f7f2"/>
  <text x="211" y="532" text-anchor="middle" class="phase">2 · STEADY STATE</text>
  <rect x="945" y="506" width="190" height="38" rx="19" fill="#e6f7f2" stroke="#1D9E75"/>
  <text x="1040" y="531" text-anchor="middle" style="font: 700 15px Inter, Arial, sans-serif; fill: #0F6E56;">READINESS: UP</text>

  <rect x="65" y="574" width="210" height="92" rx="14" class="card"/>
  <text x="170" y="608" text-anchor="middle" class="heading">Later Kafka records</text>
  <text x="170" y="635" text-anchor="middle" class="small">Same topic, same listener</text>

  <path d="M275 620H362" class="live"/>
  <text x="319" y="605" text-anchor="middle" class="tiny">CONTINUE</text>

  <rect x="369" y="574" width="220" height="92" rx="14" class="card"/>
  <text x="479" y="608" text-anchor="middle" class="heading">Update local cache</text>
  <text x="479" y="635" text-anchor="middle" class="small">Pods converge independently</text>

  <rect x="705" y="574" width="419" height="92" rx="14" class="card"/>
  <text x="914" y="607" text-anchor="middle" class="heading">Requests and scheduled jobs proceed</text>
  <text x="914" y="635" text-anchor="middle" class="small">Reads are local — no Kafka call on the read path</text>

  <path d="M705 620H596" class="arrow"/>
  <text x="650" y="605" text-anchor="middle" class="tiny">READ</text>

  <path d="M1016 398V456H914V566" class="arrow"/>
  <text x="970" y="477" text-anchor="middle" class="label">ALL TARGETS REACHED</text>

  <text x="600" y="742" text-anchor="middle" class="small">New writes do not extend the captured startup target; a large existing log is what makes replay slow.</text>
</svg>
