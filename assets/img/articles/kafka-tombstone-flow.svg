<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">A Kafka tombstone removes a key from every local cache</title>
  <desc id="desc">An administrator publishes a null value for a configuration key. Kafka retains the tombstone for the configured retention window and every pod consumes it and removes that key from local memory.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1D9E75"/></marker><style>.title{font:700 28px Inter,Arial,sans-serif;fill:#1a1a1a}.heading{font:700 17px Inter,Arial,sans-serif;fill:#1a1a1a}.small{font:500 14px Inter,Arial,sans-serif;fill:#52635d}.label{font:700 13px Inter,Arial,sans-serif;fill:#0F6E56}.card{fill:#fff;stroke:#1D9E75;stroke-width:2}.soft{fill:#f0fdf8;stroke:#b9e8da;stroke-width:1.5}.arrow{fill:none;stroke:#1D9E75;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="500" rx="18" fill="#fbfefc"/><text x="600" y="47" text-anchor="middle" class="title">A tombstone deletes one key from every local cache</text>
  <rect x="45" y="147" width="235" height="200" rx="14" class="card"/><circle cx="162" cy="198" r="25" fill="#1D9E75"/><path d="M150 198h24" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="162" y="246" text-anchor="middle" class="heading">Config administrator</text><rect x="76" y="274" width="172" height="48" rx="9" fill="#fff0ed" stroke="#e7b5aa"/><text x="162" y="294" text-anchor="middle" class="label">feature.dark-mode</text><text x="162" y="314" text-anchor="middle" style="font:700 14px Inter,Arial,sans-serif;fill:#9d3b2e">value = null</text>
  <path d="M280 247H358" class="arrow"/><text x="319" y="230" text-anchor="middle" class="label">PUBLISH</text>
  <rect x="365" y="116" width="300" height="262" rx="16" class="card"/><text x="515" y="154" text-anchor="middle" class="heading">Compacted Kafka topic</text><rect x="400" y="181" width="230" height="82" rx="10" class="soft"/><text x="515" y="208" text-anchor="middle" class="label">LATEST RECORD FOR KEY</text><text x="515" y="235" text-anchor="middle" class="small">feature.dark-mode → null</text><text x="515" y="294" text-anchor="middle" class="small">Tombstone remains observable during</text><text x="515" y="317" text-anchor="middle" class="label">delete.retention.ms</text><text x="515" y="347" text-anchor="middle" class="small">then compaction may remove it</text>
  <path d="M665 247H718V164H775" class="arrow"/><path d="M665 247H718V330H775" class="arrow"/><text x="718" y="229" text-anchor="middle" class="label">BROADCAST</text>
  <g><rect x="782" y="102" width="370" height="128" rx="14" class="card"/><rect x="804" y="124" width="92" height="84" rx="10" fill="#e6f7f2"/><text x="850" y="158" text-anchor="middle" class="heading">Pod A</text><text x="850" y="184" text-anchor="middle" class="small">group A</text><text x="926" y="146" class="heading">Local cache</text><text x="926" y="177" class="small">remove("feature.dark-mode")</text><text x="926" y="201" class="label">KEY ABSENT</text></g>
  <g><rect x="782" y="266" width="370" height="128" rx="14" class="card"/><rect x="804" y="288" width="92" height="84" rx="10" fill="#e6f7f2"/><text x="850" y="322" text-anchor="middle" class="heading">Pod B</text><text x="850" y="348" text-anchor="middle" class="small">group B</text><text x="926" y="310" class="heading">Local cache</text><text x="926" y="341" class="small">remove("feature.dark-mode")</text><text x="926" y="365" class="label">KEY ABSENT</text></g>
  <rect x="365" y="426" width="787" height="42" rx="10" fill="#0F6E56"/><text x="758" y="453" text-anchor="middle" style="font:700 15px Inter,Arial,sans-serif;fill:#fff">A null value is the delete instruction — consumers must never cache it as a value</text>
</svg>
