<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">The readiness gate stays closed until Kafka startup replay reaches fixed targets</title>
  <desc id="desc">The application registers its configuration consumer, captures end offsets when partitions are assigned, applies records and advances processed positions, and opens readiness only when every partition reaches its target without an error.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1D9E75"/></marker><style>.title{font:700 28px Inter,Arial,sans-serif;fill:#1a1a1a}.number{font:700 18px Inter,Arial,sans-serif;fill:#fff}.heading{font:700 17px Inter,Arial,sans-serif;fill:#1a1a1a}.small{font:500 14px Inter,Arial,sans-serif;fill:#52635d}.label{font:700 13px Inter,Arial,sans-serif;fill:#0F6E56}.card{fill:#fff;stroke:#1D9E75;stroke-width:2}.soft{fill:#f0fdf8;stroke:#b9e8da;stroke-width:1.5}.arrow{fill:none;stroke:#1D9E75;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="610" rx="18" fill="#fbfefc"/><text x="600" y="47" text-anchor="middle" class="title">Readiness opens only after the captured replay target is reached</text>
  <line x1="130" y1="112" x2="1070" y2="112" stroke="#b9e8da" stroke-width="5" stroke-linecap="round"/>
  <g><circle cx="145" cy="112" r="25" fill="#1D9E75"/><text x="145" y="119" text-anchor="middle" class="number">1</text><text x="145" y="75" text-anchor="middle" class="label">REGISTER</text></g>
  <g><circle cx="448" cy="112" r="25" fill="#1D9E75"/><text x="448" y="119" text-anchor="middle" class="number">2</text><text x="448" y="75" text-anchor="middle" class="label">CAPTURE</text></g>
  <g><circle cx="751" cy="112" r="25" fill="#1D9E75"/><text x="751" y="119" text-anchor="middle" class="number">3</text><text x="751" y="75" text-anchor="middle" class="label">REPLAY</text></g>
  <g><circle cx="1054" cy="112" r="25" fill="#1D9E75"/><text x="1054" y="119" text-anchor="middle" class="number">4</text><text x="1054" y="75" text-anchor="middle" class="label">OPEN</text></g>
  <rect x="40" y="160" width="240" height="246" rx="14" class="card"/><text x="160" y="199" text-anchor="middle" class="heading">Pre-register consumer</text><text x="160" y="230" text-anchor="middle" class="small">The registrar discovers</text><text x="160" y="253" text-anchor="middle" class="small">@ConfigConsumer</text><rect x="70" y="282" width="180" height="52" rx="10" fill="#fff0ed" stroke="#e7b5aa"/><text x="160" y="304" text-anchor="middle" style="font:700 13px Inter,Arial,sans-serif;fill:#9d3b2e">READINESS DOWN</text><text x="160" y="325" text-anchor="middle" class="small">awaiting assignment</text><text x="160" y="371" text-anchor="middle" class="small">No traffic or gated jobs</text>
  <path d="M280 283H337" class="arrow"/>
  <rect x="344" y="160" width="240" height="246" rx="14" class="card"/><text x="464" y="199" text-anchor="middle" class="heading">Capture fixed targets</text><text x="464" y="230" text-anchor="middle" class="small">On partition assignment:</text><rect x="376" y="258" width="176" height="88" rx="10" class="soft"/><text x="464" y="282" text-anchor="middle" class="label">PARTITION 0</text><text x="464" y="306" text-anchor="middle" class="small">position 0 → target 42</text><text x="464" y="330" text-anchor="middle" class="small">target stays fixed</text><text x="464" y="376" text-anchor="middle" class="small">Empty partitions already match</text>
  <path d="M584 283H641" class="arrow"/>
  <rect x="648" y="160" width="240" height="246" rx="14" class="card"/><text x="768" y="199" text-anchor="middle" class="heading">Apply, then advance</text><text x="768" y="230" text-anchor="middle" class="small">Listener updates local cache</text><rect x="680" y="258" width="176" height="88" rx="10" class="soft"/><text x="768" y="282" text-anchor="middle" class="label">PROGRESS</text><text x="768" y="306" text-anchor="middle" class="small">processed 17 / 42</text><text x="768" y="330" text-anchor="middle" class="small">then 18 / 42 …</text><text x="768" y="376" text-anchor="middle" class="small">Failures keep the gate closed</text>
  <path d="M888 283H945" class="arrow"/>
  <rect x="952" y="160" width="208" height="246" rx="14" class="card"/><text x="1056" y="199" text-anchor="middle" class="heading">All targets reached</text><text x="1056" y="230" text-anchor="middle" class="small">Every partition caught up</text><circle cx="1056" cy="296" r="38" fill="#1D9E75"/><path d="M1038 296l12 12 25-28" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="976" y="354" width="160" height="34" rx="17" fill="#e6f7f2"/><text x="1056" y="377" text-anchor="middle" class="label">READINESS UP</text>
  <rect x="40" y="446" width="1120" height="112" rx="14" fill="#0F6E56"/><text x="600" y="480" text-anchor="middle" style="font:700 18px Inter,Arial,sans-serif;fill:#fff">The startup finish line is a snapshot, not a moving target</text><text x="600" y="510" text-anchor="middle" style="font:500 15px Inter,Arial,sans-serif;fill:#fff">Records appended after assignment continue through the listener, but they do not extend the captured end offsets.</text><text x="600" y="537" text-anchor="middle" style="font:500 15px Inter,Arial,sans-serif;fill:#fff">A large existing log can make replay slow; continuous low-volume updates cannot keep startup open forever.</text>
  <text x="600" y="590" text-anchor="middle" class="small">The readiness health endpoint exposes this state to the deployment platform.</text>
</svg>
