# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: CodeWithKyryl
tagline: Backend engineering deep dives for senior developers
email: fkirill440@gmail.com
description: >-
  Senior-level backend engineering deep dives on Spring Boot, Apache Kafka, PostgreSQL and microservices patterns — built around real, production-ready code.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://codewithkyryl.dev" # the base hostname & protocol for your site
linkedin_username: kyryl-feshchenko
telegram_username: notatlast

# Logo for Organization schema / rich results (used by jekyll-seo-tag + jekyll-og-image)
logo: /assets/img/logo.png

# Twitter / X card config (jekyll-seo-tag) -> twitter:site. twitter:creator comes from
# _data/authors.yml (without it, seo-tag falls back to "@<author name>").
twitter:
  username: code_w1th_me
  card: summary_large_image

# Drives Person/Organization `sameAs` in jekyll-seo-tag's JSON-LD
social:
  name: Kyryl Feshchenko
  links:
    - https://www.linkedin.com/in/kyryl-feshchenko
    - https://t.me/notatlast
    - https://x.com/code_w1th_me

# Search engine ownership verification (jekyll-seo-tag renders these as meta tags).
# Paste the codes from Google Search Console / Bing Webmaster Tools, then uncomment.
# Works on any host incl. Netlify. Bing matters because ChatGPT search is Bing-backed.
# Google verified via DNS TXT (Domain property) — no meta tag needed.
# Only uncomment below if you switch to URL-prefix + HTML-tag verification,
# and use ONLY the code (no "google-site-verification=" prefix).
# webmaster_verifications:
#   google: PASTE_GOOGLE_CODE_HERE
#   bing: PASTE_BING_CODE_HERE

# Build settings
theme: minima
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

future: true

collections:
  articles:
    output: true
    permalink: /:year/:month/:day/:name/

# SEO defaults
author: Kyryl Feshchenko

defaults:
  - scope:
      path: ""
      type: "articles"
    values:
      author: Kyryl Feshchenko
  # Branded share image for pages (home, practice, quizzes, labs) so every shared link gets a
  # large preview card. Articles are a collection, not pages: they get a per-post image from
  # jekyll-og-image in the production build.
  - scope:
      path: ""
      type: "pages"
    values:
      image: /assets/img/og-default.png

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# Jekyll 3.x REPLACES its default list when `exclude` is set, so the defaults are repeated.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - scripts/
  - tests/
  - openspec/
  - README.md
  - netlify.toml
