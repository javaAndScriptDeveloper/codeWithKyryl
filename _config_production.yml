# Production-only overrides, layered on top of _config.yml on Netlify:
#   bundle exec jekyll build --config _config.yml,_config_production.yml
#
# Why separate: jekyll-og-image needs libvips at runtime (present in the Netlify build
# image, not guaranteed locally). The gem itself is loaded from the Gemfile's
# :jekyll_plugins group when JEKYLL_ENV=production — listing it under `plugins:` here
# does nothing, because github-pages' safe-mode whitelist filters it out.

# Per-post Open Graph images. The plugin writes PNGs to assets/og/ and auto-injects
# og:image + twitter:image; jekyll-seo-tag then upgrades the card to summary_large_image.
og_image:
  collections: ["articles"]
  output_dir: "assets/og"
  force: false
  verbose: true
  domain: "codewithkyryl.dev"
  canvas:
    background_color: "#0F6E56"
    width: 1200
    height: 630
  header:
    font_family: "DejaVu Sans, Bold"
    color: "#FFFFFF"
  content:
    font_family: "DejaVu Sans, Regular"
    color: "#A7F3D0"
  border_bottom:
    width: 20
    fill:
      - "#1D9E75"
  image:
    # Logo pre-flattened onto the canvas colour: the plugin flattens alpha to black.
    path: "assets/img/og-logo.png"
    width: 120
    height: 120
    radius: 0
    # No `position`/`gravity` keys: jekyll-og-image 2.1.1 compares them as symbols but
    # YAML yields strings ("Invalid gravity: \"ne\""). Its defaults are top-right (:ne, x 80, y 100).
  metadata:
    fields: ["date", "tags"]
    separator: " • "
    date_format: "%B %d, %Y"
